# dsh-persona-runtime 的 bundle 补丁：把插件作为一行插进 profile 的插件树。
#
# 安装（详见 README）：
#   1. dsh plugin --profile <name> add file:<本仓库>/persona/dsh-plugin
#   2. 把 "dsh-persona-runtime" 加进该 profile package.json 的 dsh.profile.bundles
#   3. 在 profile 自己的 cordis.patch.yml（用户覆盖层）里覆盖 id=persona 的 config，
#      把 projectRoot 指到你自己的目录（本文件里的占位符不要保留）
#   4. 重启 dsh
#
# ⚠️ projectRoot 是**必填**且没有有意义的默认值：它指向含 `persona/` 子包的目录
#    （本机 = D:\DSH proj\shell）。留占位符会在启动时报 schema 错误，而不是静默降级。
#
# ⚠️ 补丁会**整块替换**目标行的 config（不合并）。在用户覆盖层里改配置时要把需要的键全写上。
- insert:
    - id: persona-runtime
      name: dsh-persona-runtime
      config:
        projectRoot: '/path/to/your/shell'      # ← 必须改（含 persona/ 子包）
        actor: ''                               # 例如 qq:2872422308；留空=匿名（陌生人档）
        userId: default
        backend: auto                           # auto | postgres | memory
        tools: true
        inject: true
        injectBudget: 3000
        refreshSteps: 0
        timeoutMs: 30000
